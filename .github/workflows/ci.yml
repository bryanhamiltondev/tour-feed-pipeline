name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Lint
        run: |
          php -l src/tour-feed-pipeline.php
          php -l demo/run.php
          php -l tests/run-tests.php
      - name: Demo
        run: php demo/run.php
      - name: Self-test
        run: php tests/run-tests.php
